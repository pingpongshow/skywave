# Skywave conformance matrix (Milestone M4 evidence).
# Every requirement row names the design doc that states it and the
# automated evidence (test binary / case, or measurement artifact) that
# demonstrates it. CI runs all listed suites; conformance CSVs live in
# docs/conformance/.

phy:
  - req: "FFT/windows numerically correct (DSP.md)"
    evidence: "test_dsp: fft known-answers, parseval, round-trip"
  - req: "48k<->12k converters >60 dB chain SNR, >60 dB image rejection (DSP.md)"
    evidence: "test_dsp: converter tone/round-trip cases"
  - req: "LDPC N=648/1944 all rates, AWGN thresholds within 0.5 dB (WAVEFORM.md)"
    evidence: "test_ldpc: threshold cases"
  - req: "Chirp signatures: Pd at family floors, 0 false alarms/60 s, CFO capture ±50 Hz every signature (branch-resolved, GAP_CLOSURE_PLAN R1), inversion detect (WAVEFORM.md)"
    evidence: "test_chirp: acquisition floor matrix"
  - req: "ZC sync: timing ±2 samples (±5 NARROW), CFO <0.5 Hz at floor (WAVEFORM.md)"
    evidence: "test_zc"
  - req: "TX spectral mask, PAPR ≤9.5 dB, pilot rules, decode-back (WAVEFORM.md)"
    evidence: "test_phy_tx"
  - req: "Full RX chain closes TX->channel->RX for all families/modes, ±45 Hz CFO on every signature, weak early path, CCIR Poor robust header, inverted spectrum, AWGN floors, CCIR fading (WAVEFORM.md)"
    evidence: "test_phy_rx (10 cases)"
  - req: "AWGN reference floors per mode/family; measured fading floors annex (WAVEFORM.md conformance annex)"
    evidence: "test_conformance + bertool campaign CSVs (docs/conformance/)"
  - req: "Watterson channel model calibrated (TESTING.md)"
    evidence: "test_chansim: doppler PSD, tap profile, AWGN calibration"

link:
  - req: "Frame envelope + all body pack/parse round-trips, malformed-input safety (PROTOCOL.md)"
    evidence: "test_frame (fuzz-clean); test_file: resume_wire_roundtrip"
  - req: "Session FSM states/timers/teardown causes (PROTOCOL.md)"
    evidence: "test_fsm"
  - req: "Handshake policy: initial mode from measured quality, family fallback (PROTOCOL.md)"
    evidence: "test_handshake"
  - req: "Selective-repeat ARQ: window, bitmap feedback, wraparound, loss matrix (PROTOCOL.md)"
    evidence: "test_arq (9 cases)"
  - req: "Connect >=90% at -8 dB WIDE AWGN (BUILD_PLAN M2)"
    evidence: "test_m2: m2_connect_floor (10/10)"
  - req: "Byte-exact bulk transfer incl. 1-in-7 loss; all three teardown paths (BUILD_PLAN M2)"
    evidence: "test_m2: m2_bulk_transfer(_with_loss), m2_disconnect_paths"
  - req: "AMC promote/demote rules, pins, fast demote (LINK_ADAPTATION.md)"
    evidence: "test_amc; test_m2: m3_mode_pin_scenario"
  - req: "HARQ chase combining gain; IR rate-stepdown beats chase at deep offsets (LINK_ADAPTATION.md)"
    evidence: "test_harq (chase 12/12 at knee-2.5; IR A/B 8/10 vs 0/10)"
  - req: "Probe-before-promote gates fragile modes (LINK_ADAPTATION.md)"
    evidence: "test_probe; test_m2: m3_promotion_through_probe"
  - req: "Carrier masking end-to-end excision (LINK_ADAPTATION.md)"
    evidence: "test_m2: m3_mask_excision"
  - req: "Burst container >=2x throughput at fast modes (PROTOCOL.md MAC)"
    evidence: "test_m2: m3_burst_container_throughput (2.5x)"
  - req: "TX frequency alignment: bootstrap at connect + slew; ±24 Hz residual <1 Hz (PROTOCOL.md)"
    evidence: "test_m2: m3_tx_freq_alignment"
  - req: "CPMODE AUTO steps under multipath (LINK_ADAPTATION.md)"
    evidence: "test_m2: m3_cp_auto_steps_under_multipath"
  - req: "AMC >=75% of genie over the SNR ramp, zero drops (BUILD_PLAN M3)"
    evidence: "test_m3_ramp (93%, 0 drops)"

services:
  - req: "Payload pipeline: coalesce 250 ms/window-full, zstd markers 0x00/0x5A, >=8-byte saving rule, 8 MiB cap (PROTOCOL.md)"
    evidence: "test_proto: marker/threshold/coalesce/cap cases"
  - req: "Exact codeword-budget segmentation, more-fragments reassembly under loss (PROTOCOL.md)"
    evidence: "test_proto: exact_codeword_budget, fragment_chain, bulk_under_loss"
  - req: "File transfer: service tags, metadata record, 32 KiB checkpoints, CRC-verified completion, EVT surface (PROTOCOL.md)"
    evidence: "test_file: records/tx-rx/two-modem cases"
  - req: "Session resume: token at START_ACK, window, sequence + file-checkpoint continuation, invalid->clean-START fallback (PROTOCOL.md)"
    evidence: "test_file: file_resume_after_link_death, resume_invalid_falls_back_to_clean_start"
  - req: "Broadcast CQ/BEACON/BCAST_DATA with fragmenting; monitor reassembly (PROTOCOL.md)"
    evidence: "test_bcast: broadcast_monitor_reassembly"
  - req: "CW ID: PARIS timing, post-disconnect + 10-min cadence, lowest priority (PROTOCOL.md)"
    evidence: "test_bcast: morse_timing_and_tone, cw_id_after_disconnect_and_periodic"
  - req: "Monitor mode: MON: lines + 0xFB records, connected suppression (INTERFACES.md)"
    evidence: "test_m2: m3_monitor_third_party"

interfaces:
  - req: "Control command surface complete per INTERFACES.md index"
    evidence: "test_tcp: command_surface_complete + control_protocol_scripted_session"
  - req: "STATUS / STATUS JSON field set (INTERFACES.md)"
    evidence: "test_st2: st2_scripted_session_over_tcp (scrapes both)"
  - req: "Single-client TCP servers, line framing, data-port byte stream (INTERFACES.md)"
    evidence: "test_tcp: socket cases"
  - req: "EVT notifications: STATE/CONNECTED/DISCONNECTED/MODE/BUSY (INTERFACES.md)"
    evidence: "test_tcp: notification_formats; test_st2: EVT assertions"

system:
  - req: "ST1: full stack at real 48 kHz audio through rig-realistic impairments (TESTING.md)"
    evidence: "test_system: clean path, impairments, PTT clip sweep, fuzz, soak"
  - req: "ST2: real worker/TCP stack, in-process audio + radio chain, control-scripted, fault injection (TESTING.md)"
    evidence: "test_st2: session, faults (dropout/starvation/reconnect/abort), collision"
  - req: "Thread scaffold TSan-clean; audio file replay/record bit-exact (BUILD_PLAN M0)"
    evidence: "test_audio_rings; M0 replay/record gate"
