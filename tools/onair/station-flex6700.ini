# Skywave station config: N0CALL, FLEX-6700 driven by AetherSDR on macOS.
# Values measured on the 2026-10-12 bench (docs/ONAIR_TEST_PLAN.md).
#
#   cp tools/onair/station-flex6700.ini ~/.skywave/station.ini   # once
#   tools/onair/flexptt.py --radio 192.0.2.182 --rigctl 127.0.0.1:4532 --max-rfpower 1
#   build/skywave --config ~/.skywave/station.ini
#
# Run from a COPY: --config is a load/save path, and the modem rewrites it
# on exit (comments dropped, every key written, command-line overrides
# such as ports saved in).
#
# Before any on-air run: Tailscale disconnected on this Mac (its subnet
# route sends LAN radio traffic through the tunnel), AetherSDR with DAX and
# CAT enabled, RF power set on the band in use (the Flex remembers power
# per band).

[station]
callsign = N0CALL
# Identifies after each session, and every 10 min during longer ones.
cw_id = true
cw_wpm = 20

[audio]
# By name: AetherSDR's virtual devices shift PortAudio indices.
input_device = AetherSDR DAX 1
output_device = AetherSDR TX
input_gain_db = 0
output_gain_db = 0

[ptt]
# flexptt.py, which keys through AetherSDR's CAT (a Flex takes TX audio
# from the client that owns it) and enforces the RF power limit.
method = tcp
target = 127.0.0.1:4600
# 200 ms was the smallest lead with an intact first frame on 12/12
# key-ups through AetherSDR DAX + CAT; 100 ms clipped preambles.
lead_ms = 300
tail_ms = 20

[modem]
band = hf
family = wide
